<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beach volleyball — training</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .container { width: min(1400px, 100%); margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 12px; color: #f0f6fc; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
    .topnav { display:flex; gap:8px; flex-wrap:wrap; }
    .topnav a { color:#c9d1d9; text-decoration:none; font-size:0.85rem; padding:8px 12px; border:1px solid #30363d; border-radius:6px; background:#21262d; }
    .topnav a:hover { background:#30363d; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
    .col-chart { flex: 1 1 640px; min-width: 0; }
    .col-side { flex: 0 1 340px; width: 340px; max-width: 100%; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 10px; color: #f0f6fc; }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 0.8rem; color: #8b949e; margin-bottom: 2px; }
    .augment-row label { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; color: #c9d1d9; }
    .augment-row input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; flex-shrink: 0; accent-color: #58a6ff; }
    .hint { font-size: 0.72rem; color: #6e7681; margin-top: 6px; line-height: 1.35; }
    .field input, .field select { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #c9d1d9; padding: 5px 8px; width: 100%; font-size: 0.85rem; }
    .btn { padding: 8px 16px; border: 1px solid #30363d; border-radius: 6px; font-size: 0.85rem; cursor: pointer; background: #21262d; color: #c9d1d9; transition: background 0.1s; }
    .btn:hover { background: #30363d; }
    .btn-green { background: #238636; border-color: #2ea043; color: #fff; }
    .btn-green:hover { background: #2ea043; }
    .btn-yellow { background: #9e6a03; border-color: #bb8009; color: #fff; }
    .btn-yellow:hover { background: #bb8009; }
    .btn-red { background: #da3633; border-color: #f85149; color: #fff; }
    .btn-red:hover { background: #f85149; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    #chartCanvas { width: 100%; max-width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; cursor: crosshair; }
    .status-bar { font-size: 0.8rem; color: #8b949e; min-height: 1.3em; margin-top: 8px; }
    .subcontrols { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:10px; }
    .subcontrols label { font-size:0.78rem; color:#8b949e; }
    .subcontrols input[type="range"] { width: 180px; max-width: 100%; }
    .subcontrols .value { font-size:0.8rem; color:#c9d1d9; min-width: 48px; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: 0.8rem; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    .target-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #21262d; }
    .target-row:last-child { border-bottom: none; }
    .target-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: #58a6ff; flex-shrink: 0; cursor: pointer; }
    .target-row .dot { width: 12px; height: 12px; }
    .target-name { flex: 1; font-size: 0.9rem; color: #c9d1d9; }
    .target-count { font-size: 1.1rem; font-weight: 700; color: #f0f6fc; font-variant-numeric: tabular-nums; min-width: 70px; text-align: right; }
    .target-count .label-text { font-size: 0.7rem; font-weight: 400; color: #8b949e; }

    #testOverlay { position: relative; display: inline-block; max-width: 100%; }
    #testOverlay img { width: 100%; max-width: 100%; border-radius: 6px; display: block; }
    #testOverlay canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

    @media (max-width: 900px) {
      .container { padding: 12px; }
      .row { flex-direction: column; }
      .col-chart, .col-side { flex: 1 1 auto; width: 100%; max-width: 100%; }
      .card { padding: 14px; }
      #chartCanvas { min-height: 260px; }
    }

    @media (max-width: 640px) {
      body { font-size: 15px; }
      .container { padding: 10px; }
      h1 { font-size: 1.08rem; margin-bottom: 0; }
      .topbar { align-items: flex-start; gap: 10px; }
      .topnav { width: 100%; }
      .topnav a { flex: 1 1 0; text-align: center; padding: 10px 12px; }
      .card { padding: 12px; border-radius: 10px; }
      .target-row { gap: 8px; }
      .target-name { font-size: 0.85rem; }
      .target-count { min-width: 56px; font-size: 1rem; }
      .btn-row { gap: 6px; }
      .btn-row .btn { flex: 1 1 calc(50% - 6px); padding: 10px 12px; }
      #chartCanvas { min-height: 220px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>Training Dashboard</h1>
      <nav class="topnav" aria-label="App navigation">
        <a href="/">Home</a>
        <a href="/labeler">Labeler</a>
      </nav>
    </div>
    <div class="row">
      <div class="col-chart">
        <div class="card">
          <h2>Loss over time</h2>
          <canvas id="chartCanvas" height="360"></canvas>
          <div class="subcontrols">
            <label for="smoothRange">Running average</label>
            <input id="smoothRange" type="range" min="1" max="10" step="1" value="1" />
            <span id="smoothValue" class="value">1 (off)</span>
          </div>
          <p class="status-bar" id="statusBar">Idle</p>
        </div>
        <div class="card" id="testCard" style="display:none">
          <h2>Model predictions</h2>
          <div id="testOverlay">
            <img id="testImg" />
            <canvas id="testCanvas"></canvas>
          </div>
          <p class="status-bar" id="testStatus"></p>
        </div>
      </div>
      <div class="col-side">
        <div class="card">
          <h2>Controls</h2>
          <div class="btn-row">
            <button class="btn btn-green" id="btnStart">▶ Start</button>
            <button class="btn btn-yellow" id="btnPause" disabled>⏸ Pause</button>
            <button class="btn btn-green" id="btnResume" disabled>▶ Resume</button>
            <button class="btn btn-red" id="btnReset" disabled>⟲ Reset</button>
          </div>
          <p class="status-bar" id="stateLabel">State: idle</p>
        </div>
        <div class="card" id="targetsCard">
          <h2>Targets <span style="font-size:0.75rem;font-weight:400;color:#8b949e">labeled images</span></h2>
          <div class="target-row">
            <input type="checkbox" value="court" checked />
            <span class="dot" style="background:#58a6ff"></span>
            <span class="target-name">Court lines</span>
            <span class="target-count" data-key="court">—</span>
          </div>
          <div class="target-row">
            <input type="checkbox" value="net" checked />
            <span class="dot" style="background:#3fb950"></span>
            <span class="target-name">Net</span>
            <span class="target-count" data-key="net">—</span>
          </div>
          <div class="target-row">
            <input type="checkbox" value="people" checked />
            <span class="dot" style="background:#a371f7"></span>
            <span class="target-name">People</span>
            <span class="target-count" data-key="people">—</span>
          </div>
          <div class="target-row">
            <input type="checkbox" value="ball" checked />
            <span class="dot" style="background:#39d2c0"></span>
            <span class="target-name">Ball</span>
            <span class="target-count" data-key="ball">—</span>
          </div>
        </div>
        <div class="card">
          <h2>Hyperparameters</h2>
          <div class="field"><label>Epochs</label><input id="inpEpochs" type="number" value="50" min="1" /></div>
          <div class="field"><label>Batch size</label><input id="inpBatch" type="number" value="1" min="1" /></div>
          <div class="field"><label>Learning rate</label><input id="inpLR" type="number" value="0.0001" step="0.00001" /></div>
          <div class="field"><label>Image size</label><input id="inpImgSize" type="number" value="384" min="128" step="32" /></div>
          <div class="field augment-row">
            <label><input type="checkbox" id="inpAugment" checked /> Augment during training (each batch step: new random ±45° roll per image)</label>
            <p class="hint">Applied in the training loop when a batch is used — not precomputed on the dataset. No flips.</p>
          </div>
        </div>
        <div class="card">
          <h2>Test</h2>
          <button class="btn" id="btnTest">🔍 Test on random image</button>
          <p class="status-bar" id="testInfo"></p>
        </div>
      </div>
    </div>
  </div>
  <script src="/static/train.js?v=11"></script>
</body>
</html>
