<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beach Volleyball Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="mainMenu">
        <h1 id="appTitle">🏐 Beach Volleyball<br>Tracker</h1>
        <button class="menuButton" onclick="showAnalysis()">📊 Analysis</button>
        <button class="menuButton" onclick="showRecord()">🎥 Record</button>
        <button class="menuButton" onclick="showStatistics()">📈 Statistics</button>
    </div>

    <div id="analysisContainer" class="hidden">
        <div id="analysisVideo">
            <div id="videoPlaceholder">
                <p>Select a video from the list below to start analysis.</p>
            </div>
            <video id="playbackVideo" preload="metadata" style="display: none;"></video>
            <div id="videoTime" style="display: none;">00:00:00.0</div>
        </div>

        <div id="analysisToolbox">
            <div id="videoSearchArea">
                <input type="search" id="videoSearchInput" placeholder="Search recorded videos...">
            </div>

            <div id="videoListContainer">
                </div>

            <div id="customSeekBarContainer" style="display: none; width: 100%; padding: 5px 0; box-sizing: border-box;">
                <input type="range" id="customSeekBar" value="0" min="0" step="0.1" style="width: 100%;">
            </div>

            <div id="currentVideoControls">
                <p style="margin-top:10px; margin-bottom: 5px;">Playback Controls:</p>
                <button onclick="playPause()">Play/Pause</button>
                <select id="speedSelector" onchange="changeSpeed()">
                    <option value="0.1">0.1x</option>
                    <option value="0.25">0.25x</option>
                    <option value="0.5">0.5x</option>
                    <option value="1" selected>1x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2x</option>
                    <option value="5">5x</option>
                    <option value="10">10x</option>
                </select>
                <p style="margin-top:15px; margin-bottom: 5px;">Load external video:</p>
                <input type="file" id="videoFileInput" accept="video/*">
            </div>
            <button onclick="showMainMenu()" class="backButton" style="margin-top: 20px; width: 100%; box-sizing: border-box;">← Back to Menu</button>
        </div>
    </div>

    <div id="videoContainer" class="hidden">
        <video id="video" autoplay muted playsinline></video>
        <div id="clock" class="hidden">00:00:00.0</div>
        <button id="stopButton" class="hidden">Stop Recording</button>
        <button id="startButton">Start Camera</button>
        <button onclick="showMainMenu()" class="backButton">← Back</button> </div>

    <div id="statisticsContainer" class="hidden">
        <h2>📈 Video Statistics</h2>
        <div id="statsSearchArea">
            <input type="search" id="statsSearchInput" placeholder="Filter videos for statistics...">
        </div>
        <div id="statsVideoCount">Videos included: 0</div>
        <table id="statsTable">
            <thead>
                <tr>
                    <th>Property</th>
                    <th>Min</th>
                    <th>Max</th>
                    <th>Average</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Duration (s)</td>
                    <td id="statDurationMin">-</td>
                    <td id="statDurationMax">-</td>
                    <td id="statDurationAvg">-</td>
                </tr>
                <tr>
                    <td>Width (px)</td>
                    <td id="statWidthMin">-</td>
                    <td id="statWidthMax">-</td>
                    <td id="statWidthAvg">-</td>
                </tr>
                <tr>
                    <td>Height (px)</td>
                    <td id="statHeightMin">-</td>
                    <td id="statHeightMax">-</td>
                    <td id="statHeightAvg">-</td>
                </tr>
                <tr>
                    <td>Pixels (MP)</td>
                    <td id="statPixelsMin">-</td>
                    <td id="statPixelsMax">-</td>
                    <td id="statPixelsAvg">-</td>
                </tr>
                <tr>
                    <td>FPS</td>
                    <td id="statFpsMin">-</td>
                    <td id="statFpsMax">-</td>
                    <td id="statFpsAvg">-</td>
                </tr>
            </tbody>
        </table>
        <button onclick="showMainMenu()" class="backButton" style="margin-top: 20px; width:100%; box-sizing:border-box;">← Back to Menu</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
