<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beach Volleyball Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Menu -->
    <div id="mainMenu">
        <h1 id="appTitle">🏐 Beach Volleyball<br>Tracker</h1>
        <button class="menuButton" onclick="showAnalysis()">📊 Analysis</button>
        <button class="menuButton" onclick="showRecord()">🎥 Record</button>
        <button class="menuButton" onclick="showStatistics()">📈 Statistics</button>
    </div>
    
    <!-- Analysis Interface -->
    <div id="analysisContainer" class="hidden">
        <div id="analysisVideo">
            <video id="playbackVideo" controls></video>
            <div id="videoTime">00:00:00.0</div>
        </div>
        <div id="analysisControls">
            <input type="file" id="videoFileInput" accept="video/*" style="margin-bottom: 10px;">
            <div style="margin-bottom: 10px;">
                <button onclick="playPause()">Play/Pause</button>
                <select id="speedSelector" onchange="changeSpeed()">
                    <option value="0.1">0.1x</option>
                    <option value="0.25">0.25x</option>
                    <option value="0.5">0.5x</option>
                    <option value="1" selected>1x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2x</option>
                    <option value="5">5x</option>
                    <option value="10">10x</option>
                </select>
            </div>
            <button onclick="showMainMenu()">← Back to Menu</button>
        </div>
    </div>
    
    <!-- Recording Interface -->
    <div id="videoContainer" class="hidden">
        <video id="video" autoplay muted playsinline></video>
        <div id="clock" class="hidden">00:00:00.0</div>
        <button id="stopButton" class="hidden">Stop Recording</button>
        <button id="startButton">Start Camera</button>
        <button onclick="showMainMenu()" class="backButton">← Back</button>
    </div>
    
    <!-- Statistics -->
    <div id="statisticsContainer" class="hidden">
        <h2>📈 Video Statistics</h2>
        <button onclick="showMainMenu()" class="backButton">← Back</button>
        <div id="statisticsContent">No videos recorded yet</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
